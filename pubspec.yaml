name: ai_secretary
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.15+16

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  dio: ^5.9.2
  sqflite: ^2.4.2+1
  fsrs: 2.0.1
  record: ^7.0.0
  sherpa_onnx: 1.13.8
  just_audio: ^0.10.5
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  mcp_dart: ^2.4.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  default-flavor: foundation

  assets:
    - path: assets/asr/zipformer/
      flavors: [foundation]
    - path: assets/study/
      flavors: [study]

hooks:
  user_defines:
    sqlite3:
      source: system
      name: sqlite3
