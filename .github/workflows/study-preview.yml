name: Study web preview
on:
  pull_request:
    paths: ['prototypes/study-mobile/**', '.github/workflows/study-preview.yml']
  push:
    branches: ['codex/study-web-preview']
    paths: ['prototypes/study-mobile/**', '.github/workflows/study-preview.yml']
permissions:
  contents: read
jobs:
  preview-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/study-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify demo state contracts
        run: npm test
