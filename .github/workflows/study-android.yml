name: Study Android source contracts
on:
  pull_request:
    paths: ['lib/**', 'test/**', 'android/**', 'assets/study/**', 'pubspec.*', 'integration_test/**', '.github/workflows/study-android.yml']
  push:
    branches: ['codex/english-android-app']
    paths: ['lib/**', 'test/**', 'android/**', 'assets/study/**', 'pubspec.*', 'integration_test/**', '.github/workflows/study-android.yml']
permissions:
  contents: read
jobs:
  flutter-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Source CI includes main_study.dart. The study flavor APK requires local
      # private DUIX resources/configuration and is never built or uploaded here.
      - name: Analyze main_study.dart, modular study app and foundation
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Domain, widget, runtime and baseline contracts
        run: flutter test --no-pub
      - name: Check reviewed vocabulary sizes and stable identities
        run: node --input-type=module -e "import fs from 'node:fs'; const v=JSON.parse(fs.readFileSync('assets/study/vocabulary.json')); if(v.books.map(b=>b.ids.length).join(',')!=='1000,1500,1500,1500'||new Set(v.words.map(w=>w.id)).size!==2474) process.exit(1);"
